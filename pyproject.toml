[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "librarian-ai"
version = "0.1.1"
description = "Personal Intelligence ETL pipeline for Telegram, Web Scraping, AI Triage, and Obsidian Vault integration."
authors = [{ name = "Librarian AI Team" }]
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36.0",
    "playwright>=1.44.0",
    "trafilatura>=1.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pillow>=10.3.0",
    "google-api-python-client>=2.130.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
